<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b9472f">
  <meta name="description" content="Bếp Khởi Nghiệp: game bán hàng xe đẩy, ghi order, tính tiền, thối tiền và nấu món.">
  <title>Bếp Khởi Nghiệp</title>
  <!-- PWA: cài vào màn hình chính, chơi offline (service worker sw.js đăng ký trong src/main.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bếp KN">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- M5 (0.5.0): tải sớm font tiêu đề Baloo 2 (bộ chữ Latin, nút và tiêu đề dùng ngay ở màn đầu); bộ dấu tiếng Việt
       fonts/baloo2-800-vi.woff2 tải theo unicode-range khi cần. crossorigin bắt buộc với font để khớp yêu cầu của CSS. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/baloo2-800-latin.woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <!-- M5 Đợt 2: dải phố / hàng khách tách khỏi game.css; gắn NGAY SAU game.css để giữ nguyên thứ tự cascade -->
  <link rel="stylesheet" href="css/street.css">
  <link rel="stylesheet" href="css/kitchen.css">
  <!-- M5: CSS sân khấu mini-game tách khỏi kitchen.css; gắn NGAY SAU kitchen.css để giữ nguyên thứ tự cascade -->
  <link rel="stylesheet" href="css/mg-prep.css">
  <link rel="stylesheet" href="css/mg-heat.css">
  <link rel="stylesheet" href="css/mg-mix.css">
  <link rel="stylesheet" href="css/meta.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/tour.css">
  <!-- M5: chủ đề kiểu game (lớp g-, biến --g-), hiệu ứng và thành phần bếp mới, màn gọi món mới (lớp co-) -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/fx.css">
  <link rel="stylesheet" href="css/counter.css">
  <!-- M5 Đợt 2: Quầy theo khâu — thu tiền (lớp cs-), chuyển khoản QR và phiếu thu (lớp qc-, rc-); gắn sau game.css và
       counter.css để đè kiểu quầy cũ -->
  <link rel="stylesheet" href="css/cashier.css">
  <link rel="stylesheet" href="css/receipt.css">
  <!-- M5 Đợt 2: phiếu chấm, hộp tình huống và hộp phàn nàn kiểu game (gắn cuối: đè kiểu cũ ở game.css, meta.css) -->
  <link rel="stylesheet" href="css/sheet.css">
</head>
<body>
  <div id="app" class="app-frame">
    <div id="boot" class="boot">
      <p class="boot-title">Bếp Khởi Nghiệp</p>
      <p class="boot-text">Đang dọn xe ra đầu hẻm…</p>
    </div>
  </div>
  <noscript>
    <div class="boot boot-error">
      <p class="boot-title">Bếp Khởi Nghiệp</p>
      <p class="boot-text">Trình duyệt đang tắt JavaScript. Hãy bật JavaScript để chơi game.</p>
    </div>
  </noscript>
  <script>
    // Mở trực tiếp tệp (file://) thì ES Modules không chạy được: hiện hướng dẫn.
    (function () {
      if (location.protocol !== 'file:') return
      var box = document.getElementById('boot')
      if (!box) return
      box.className = 'boot boot-error'
      box.innerHTML = '<p class="boot-title">Bếp Khởi Nghiệp</p>' +
        '<p class="boot-text">Game cần chạy qua máy chủ tĩnh, không mở trực tiếp tệp.</p>' +
        '<p class="boot-text">Hãy chạy <code>npm run serve</code> rồi mở <b>http://localhost:8080</b></p>'
    })()
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
